services:
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ['9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts: ['host.docker.internal:host-gateway']
  grafana:
    image: grafana/grafana:11.1.0
    ports: ['3000:3000']
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cartvista
